<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>StormCast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main class="frame">
      <!-- Photo stage -->
      <section id="stage" class="stage" aria-label="Photo slideshow">
        <div class="slide" data-layer="0">
          <img class="slide-bg" alt="" aria-hidden="true" />
          <img class="slide-img" alt="" />
        </div>
        <div class="slide" data-layer="1">
          <img class="slide-bg" alt="" aria-hidden="true" />
          <img class="slide-img" alt="" />
        </div>

        <div id="radarSlide" class="radar-slide" aria-hidden="true">
          <img id="radarImage" class="radar-img" alt="NOAA weather radar loop" />
          <div class="radar-header">
            <span class="radar-title">Live Radar</span>
            <span id="radarStation" class="radar-sub"></span>
            <span id="radarUpdated" class="radar-sub"></span>
          </div>
          <div id="radarEmpty" class="radar-empty hidden">Radar unavailable</div>
        </div>

        <div id="emptyState" class="empty-state hidden">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
          <h2>No photos yet</h2>
          <p id="emptyHint">Loading…</p>
        </div>

        <div id="alertBanner" class="alert-banner hidden" role="alert">
          <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>
          <div class="alert-text">
            <span id="alertEvent" class="alert-event"></span>
            <span id="alertDetail" class="alert-detail"></span>
          </div>
          <span id="alertCount" class="alert-count"></span>
        </div>

        <div id="counter" class="stage-ui counter"></div>

        <div id="controls" class="stage-ui controls">
          <button id="prevBtn" class="ctl-btn" type="button" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button id="playBtn" class="ctl-btn ctl-btn-lg" type="button" aria-label="Pause slideshow">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
            <svg id="playIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" /></svg>
          </button>
          <button id="nextBtn" class="ctl-btn" type="button" aria-label="Next photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <button id="radarBtn" class="ctl-btn" type="button" aria-label="Show radar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" /><path d="M4 6h.01" /><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" /><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" /><path d="M12 18h.01" /><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" /><circle cx="12" cy="12" r="2" /><path d="m13.41 10.59 5.66-5.66" /></svg>
          </button>
        </div>

        <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
      </section>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="card clock-card">
          <div class="clock"><span id="clockTime">--:--</span><span id="clockAmPm" class="ampm"></span></div>
          <div id="clockDate" class="date">&nbsp;</div>
        </div>

        <div class="card hero">
          <div class="hero-main">
            <div id="heroIcon" class="hero-icon"></div>
            <div>
              <div class="hero-temp"><span id="heroTemp">--</span><span class="deg">°</span></div>
              <div id="heroDesc" class="hero-desc">Loading weather…</div>
            </div>
          </div>
          <div class="hero-meta">
            <span id="heroLocation">—</span>
            <span id="heroRange"></span>
          </div>
        </div>

        <div class="card details" id="details">
          <div class="detail" data-detail="feels"></div>
          <div class="detail" data-detail="humidity"></div>
          <div class="detail" data-detail="wind"></div>
          <div class="detail" data-detail="pressure"></div>
          <div class="detail" data-detail="sun"></div>
          <div class="detail" data-detail="visibility"></div>
        </div>

        <div class="card hourly" id="hourly"></div>

        <div class="card forecast" id="forecast"></div>

        <div class="status" id="status">
          <span class="status-item"><i class="dot" id="dotEmail"></i>Email</span>
          <span class="status-item"><i class="dot" id="dotWeather"></i>Weather</span>
          <span class="status-item"><i class="dot" id="dotRadar"></i>Radar</span>
          <span class="status-item" id="photoCount">0 photos</span>
        </div>
      </aside>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
